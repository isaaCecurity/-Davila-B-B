# BakeFlow CI — P11.1 quality gate.
#
# Runs the three checks that are reproducible from the repository alone:
# lint, typecheck, and the pytest spec-coverage suite.
#
# tests/sql/*.sql run in the `sql-tests` job below, against a THROWAWAY Postgres service
# container in the runner (supabase/postgres — includes the auth/storage/vault schemas and
# extensions the baseline DDL needs, not just vanilla Postgres). This container is destroyed
# with the runner at the end of every run; nothing here ever touches the live production
# project (tvfyxpafbpnkneujcnvr), and no production credential is used or needed.
#
# STATUS (2026-09-01): validated end-to-end against a real throwaway instance (an AWS EC2 box
# with Docker — local Docker Desktop had an unrelated DNS issue reaching Docker Hub's CDN, see
# IMPLEMENTATION_LOG.md), not just written against known facts. The exact chain this job runs
# (shim -> baseline -> seed -> fixtures -> all suites) was run repeatedly from a genuinely fresh
# database until every environment-caused failure was found and fixed: two default-privilege
# gaps (functions AND tables both need an explicit REVOKE the baseline never had — this
# project's `postgres` role auto-grants authenticated/anon on anything it creates, invisible on
# live only because every object had already been individually locked down over many prior
# migrations), a missing `private` schema/function, a function-ordering bug (has_role used
# before it was defined), a missing storage.buckets/objects stub, and several test files with
# stale assumptions (hardcoded role ids that only happened to match live's legacy values, a
# missing shared fixture row, a batch-number collision). Final result: 14/16 suites pass clean;
# the other 2 fail on pre-existing, already-known issues unrelated to this environment work (a
# stale test asserting a since-resolved defect, and the documented rate_limit_events RLS gap) —
# see IMPLEMENTATION_LOG.md 2026-09-01 for the full trace. Re-run this job's own steps locally
# after any future baseline/fixture change; a first CI run on GitHub's actual runners is still
# the true proof this exact YAML works there (different network, different image cache state)
# — treat it as confirmation, not as something already guaranteed by the above.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bakeflow-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches engines.node (">=22.13.0") in bakeflow-frontend/package.json.
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: bakeflow-frontend/package-lock.json

      # Corepack is enabled explicitly rather than relying on `corepack npm <cmd>`.
      #
      # Locally we use the `corepack npm …` shim because a global `corepack enable`
      # needs administrator rights on Windows (TD-009). That constraint does not exist
      # on a Linux runner, and every CI run since this workflow was added failed at this
      # step with the shim — lint and typecheck were skipped and have never executed
      # remotely. `corepack enable` + `prepare --activate` is the documented path and
      # puts the pinned npm on PATH for every later step.
      #
      # COREPACK_ENABLE_DOWNLOAD_PROMPT=0 is required because Corepack must fetch
      # npm@10.8.2 (the runner ships a different version) and will not prompt in a
      # non-interactive shell.
      - name: Enable Corepack and activate the pinned npm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack --version
          corepack enable
          corepack prepare npm@10.8.2 --activate

      # `corepack enable` does not put the pinned npm ahead of the runner's own on PATH:
      # measured on this runner, bare `npm --version` still reports the version Node
      # 22.13 ships, not 10.8.2. So the pinned npm is invoked through Corepack
      # explicitly, and the assertion checks that same entry point — asserting on bare
      # `npm` only proved the shim was not winning the PATH race.
      #
      # Deliberately BEFORE the install: if the pin stops working, this fails with an
      # obvious cause rather than letting a mismatched npm resolve the lockfile. Both
      # versions are printed so the log shows the difference rather than hiding it.
      - name: Verify the pinned npm resolves
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          echo "bare npm on PATH : $(npm --version)"
          echo "corepack npm     : $(corepack npm --version)"
          test "$(corepack npm --version)" = "10.8.2"

      - name: Install (pinned npm, lifecycle scripts denied by .npmrc)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: corepack npm ci

      # tsc covers packages/* as well as apps/mobile: apps/mobile/tsconfig.json
      # includes them, verified by tsc resolving ../../packages/* into the program.
      - name: Typecheck
        run: npm run typecheck

      # Two flat configs, disjoint paths: apps/mobile/eslint.config.js for the app,
      # the root eslint.config.js for packages/*. --max-warnings=0 in both so a
      # warning fails the gate instead of passing silently.
      - name: Lint
        run: npm run lint

      # P11.3 (2026-08-28): pure-logic unit tests (packages/validation, packages/types).
      # No live database or device needed, unlike tests/sql/*.sql or a device build —
      # nothing here is excluded by this workflow's own stated reasons for skipping those.
      - name: Unit tests
        run: npm test

  spec:
    name: Spec coverage (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/test_spec_coverage.py imports only os, re and pytest — there is no
      # requirements file to install, and inventing one is out of scope here.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run spec-coverage suite
        run: python -m pytest -q

  sql-tests:
    name: Database suites (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      db:
        # supabase/postgres, not vanilla postgres: the baseline DDL references auth.uid(),
        # auth.jwt(), the storage schema (storage.objects/buckets/foldername), and the
        # supabase_vault extension — none of which exist in a plain postgres image. Pin the
        # exact tag deliberately (matches supabase/config.toml's major_version = 17); do not
        # float this to `latest` or a bare major-version tag.
        image: supabase/postgres:17.6.1.165
        env:
          POSTGRES_PASSWORD: throwaway_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGURL: postgresql://postgres:throwaway_ci_password@localhost:5432/postgres
      # supabase_admin, not postgres: on this image `postgres` is deliberately NOT a
      # superuser (matches real hosted Supabase, where even the postgres role can't touch the
      # auth schema) — only supabase_admin can. Used for exactly one step below.
      PGURL_ADMIN: postgresql://supabase_admin:throwaway_ci_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for the throwaway database to accept connections
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 2
          done
          echo "database never became ready" >&2
          exit 1

      # Must run BEFORE the baseline: a function inside it calls auth.jwt(), which the stock
      # image doesn't have at all. See the shim file's own header for the full story.
      - name: Apply throwaway auth-compatibility shim (not for real databases)
        run: psql "$PGURL_ADMIN" -v ON_ERROR_STOP=1 -f tests/sql/throwaway_auth_compat_shim.sql

      - name: Apply baseline schema DDL
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260809_live_schema.sql

      - name: Apply platform seed data (roles, permissions)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Apply shared test-tenant fixtures
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f tests/sql/fixtures.sql

      # Every file here (fixtures.sql and throwaway_auth_compat_shim.sql excluded, both applied
      # above) wraps itself in its own BEGIN...ROLLBACK, so running them in sequence against the
      # same database is safe — none of them leave data behind for the next one to trip over.
      # function_privilege_audit.sql is the one exception to the transaction pattern (it's
      # read-only catalog introspection, no transaction needed) and runs fine in the same loop.
      #
      # Deliberately NOT `set -e` here: that would abort the whole loop at the first failing
      # file (alphabetically, catalog_read_rls.sql) and silently skip every file after it —
      # exactly what happened on the first real run of this job (2026-09-01, run 33523857545),
      # which reported one failure but never even attempted the other 15 files. Each file is run
      # to completion, every result is recorded, and the job fails at the end if anything
      # unexpected happened — so one known issue can never hide a regression in an unrelated file.
      - name: Run every tests/sql/*.sql suite
        run: |
          declare -a failed
          for f in tests/sql/*.sql; do
            case "$f" in
              tests/sql/fixtures.sql|tests/sql/throwaway_auth_compat_shim.sql) continue ;;
            esac
            echo "::group::$f"
            if ! psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"; then
              failed+=("$f")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} suite(s) failed: ${failed[*]}"
            exit 1
          fi
          echo "all suites passed"
